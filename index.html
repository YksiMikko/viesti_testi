<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muistiinpanot</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --paper: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent: #2563eb;
      --danger: #ef4444;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 16px;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      background: var(--paper);
      border-radius: var(--radius);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
      border: 1px solid var(--border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: fit-content;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .app-title {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .wipe-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 6px 10px;
      border-radius: 6px;
    }
    .wipe-btn:active {
      background: #fee2e2;
      color: var(--danger);
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input, textarea, select {
      width: 100%;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      font-family: inherit;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      background: #fff;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
      line-height: 1.4;
    }

    .result-box {
      background: #f8fafc;
      font-family: ui-monospace, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
    }

    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button.btn {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-dark {
      background: #1e293b;
      color: #fff;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-secondary {
      background: #f1f5f9;
      color: var(--text);
      border: 1px solid var(--border);
      width: 100%;
    }

    .timer-container {
      display: none;
      height: 4px;
      background: #e2e8f0;
      border-radius: 2px;
      overflow: hidden;
      margin-top: -6px;
    }

    .timer-bar {
      height: 100%;
      background: var(--accent);
      width: 100%;
      transform-origin: left;
    }

    .status-text {
      font-size: 0.8rem;
      text-align: center;
      min-height: 1.2em;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .settings-row select {
      flex: 1;
      padding: 6px 10px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <div class="app-title">📝 Muistiinpanot</div>
    <button class="wipe-btn" onclick="wipeAll()">Tyhjennä ruutu</button>
  </div>

  <div class="field-group">
    <label for="pwd">Avainsana</label>
    <input type="password" id="pwd" placeholder="Kirjoita avain...">
  </div>

  <div class="field-group">
    <label for="inputMsg">Tekstisisältö</label>
    <textarea id="inputMsg" placeholder="Kirjoita muistiinpano tai liitä koodattu teksti..."></textarea>
  </div>

  <div class="button-grid">
    <button class="btn btn-dark" onclick="handleEncrypt()">Tallenna (Salaa)</button>
    <button class="btn btn-primary" onclick="handleDecrypt()">Avaa muistiinpano</button>
  </div>

  <div class="field-group">
    <label for="outputMsg">Tulos</label>
    <textarea id="outputMsg" class="result-box" readonly placeholder="Purettu teksti tai koodi näkyy tässä..."></textarea>
  </div>

  <div class="timer-container" id="timerContainer">
    <div class="timer-bar" id="timerBar"></div>
  </div>

  <button class="btn btn-secondary" onclick="copyOutput()">Kopioi leikepöydälle</button>

  <div class="settings-row">
    <span>Automaattinen tyhjennys:</span>
    <select id="autoWipeTime">
      <option value="15">15 sekuntia</option>
      <option value="30" selected>30 sekuntia</option>
      <option value="60">1 minuutti</option>
      <option value="0">Pois päältä</option
