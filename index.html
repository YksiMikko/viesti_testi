<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muistiinpanot</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --paper: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent: #2563eb;
      --danger: #ef4444;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 16px;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      background: var(--paper);
      border-radius: var(--radius);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
      border: 1px solid var(--border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: fit-content;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .app-title {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .wipe-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 6px 10px;
      border-radius: 6px;
    }
    .wipe-btn:active {
      background: #fee2e2;
      color: var(--danger);
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input, textarea, select {
      width: 100%;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      font-family: inherit;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      background: #fff;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
      line-height: 1.4;
    }

    .result-box {
      background: #f8fafc;
      font-family: ui-monospace, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
    }

    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button.btn {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-dark {
      background: #1e293b;
      color: #fff;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-secondary {
      background: #f1f5f9;
      color: var(--text);
      border: 1px solid var(--border);
      width: 100%;
    }

    .timer-container {
      display: none;
      height: 4px;
      background: #e2e8f0;
      border-radius: 2px;
      overflow: hidden;
      margin-top: -6px;
    }

    .timer-bar {
      height: 100%;
      background: var(--accent);
      width: 100%;
      transform-origin: left;
    }

    .status-text {
      font-size: 0.85rem;
      text-align: center;
      min-height: 1.4em;
      font-weight: 500;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .settings-row select {
      flex: 1;
      padding: 6px 10px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <div class="app-title">📝 Muistiinpanot</div>
    <button class="wipe-btn" id="wipeBtn" type="button">Tyhjennä ruutu</button>
  </div>

  <div class="field-group">
    <label for="pwd">Avainsana</label>
    <input type="password" id="pwd" placeholder="Kirjoita avain...">
  </div>

  <div class="field-group">
    <label for="inputMsg">Tekstisisältö</label>
    <textarea id="inputMsg" placeholder="Kirjoita muistiinpano tai liitä koodattu teksti..."></textarea>
  </div>

  <div class="button-grid">
    <button class="btn btn-dark" id="btnEncrypt" type="button">Tallenna (Salaa)</button>
    <button class="btn btn-primary" id="btnDecrypt" type="button">Avaa muistiinpano</button>
  </div>

  <div class="field-group">
    <label for="outputMsg">Tulos</label>
    <textarea id="outputMsg" class="result-box" readonly placeholder="Purettu teksti tai koodi näkyy tässä..."></textarea>
  </div>

  <div class="timer-container" id="timerContainer">
    <div class="timer-bar" id="timerBar"></div>
  </div>

  <button class="btn btn-secondary" id="btnCopy" type="button">Kopioi leikepöydälle</button>

  <div class="settings-row">
    <span>Automaattinen tyhjennys:</span>
    <select id="autoWipeTime">
      <option value="15">15 sekuntia</option>
      <option value="30" selected>30 sekuntia</option>
      <option value="60">1 minuutti</option>
      <option value="0">Pois päältä</option>
    </select>
  </div>

  <div id="status" class="status-text"></div>
</div>

<script>
  let wipeTimeout = null;
  let animFrame = null;

  function showStatus(text, color) {
    const s = document.getElementById("status");
    s.innerText = text;
    s.style.color = color;
  }

  // Tarkistetaan heti sivun latautuessa, että selain sallii kryptografian
  window.addEventListener("DOMContentLoaded", () => {
    if (!window.crypto || !window.crypto.subtle) {
      showStatus("Huom: Selain vaatii HTTPS-yhteyden salaukseen!", "#ef4444");
    }
  });

  async function deriveKey(password, salt) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
    );
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
      keyMaterial,
      { name: "AES-GCM", length: 256 },
      false,
      ["encrypt", "decrypt"]
    );
  }

  async function handleEncrypt() {
    clearTimers();
    const pwd = document.getElementById("pwd").value;
    const text = document.getElementById("inputMsg").value;

    if (!window.crypto || !window.crypto.subtle) {
      showStatus("Virhe: Osoitteen täytyy alkaa https://", "#ef4444");
      return;
    }

    if (!pwd || !text) {
      showStatus("Syötä avainsana ja teksti!", "#ef4444");
      return;
    }

    try {
      showStatus("Salataan...", "#64748b");
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveKey(pwd, salt);
      const encoded = new TextEncoder().encode(text);

      const cipher = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, encoded);
      const cipherBytes = new Uint8Array(cipher);
      const combined = new Uint8Array(salt.length + iv.length + cipherBytes.length);

      combined.set(salt, 0);
      combined.set(iv, salt.length);
      combined.set(cipherBytes, salt.length + iv.length);

      // Base64-pakkaus
      let binaryStr = "";
      const len = combined.byteLength;
      for (let i = 0; i < len; i++) {
        binaryStr += String.fromCharCode(combined[i]);
      }
      
      document.getElementById("outputMsg").value = btoa(binaryStr);
      showStatus("Viesti salattu! Voit kopioida koodin.", "#16a34a");
    } catch (e) {
      showStatus("Virhe salauksessa: " + e.message, "#ef4444");
    }
  }

  async function handleDecrypt() {
    clearTimers();
    const pwd = document.getElementById("pwd").value;
    const cipherText = document.getElementById("inputMsg").value.trim();

    if (!pwd || !cipherText) {
      showStatus("Syötä avainsana ja purettava koodi!", "#ef4444");
      return;
    }

    try {
      showStatus("Avataan...", "#64748b");
      const binary = atob(cipherText);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }

      if (bytes.length < 28) {
        throw new Error("Liian lyhyt koodi");
      }

      const salt = bytes.slice(0, 16);
      const iv = bytes.slice(16, 28);
      const data = bytes.slice(28);

      const key = await deriveKey(pwd, salt);
      const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, data);

      document.getElementById("outputMsg").value = new TextDecoder().decode(decrypted);
      showStatus("Muistiinpano avattu!", "#16a34a");
      startAutoWipe();
    } catch (e) {
      showStatus("Avaus epäonnistui: väärä avainsana tai virheellinen koodi.", "#ef4444");
    }
  }

  function startAutoWipe() {
    const seconds = parseInt(document.getElementById("autoWipeTime").value, 10);
    if (seconds <= 0) return;

    const bar = document.getElementById("timerBar");
    const container = document.getElementById("timerContainer");
    container.style.display = "block";

    let start = performance.now();
    let totalMs = seconds * 1000;

    function frame(now) {
      let elapsed = now - start;
      let rem = Math.max(0, 1 - (elapsed / totalMs));
      bar.style.transform = `scaleX(${rem})`;
      if (elapsed < totalMs) {
        animFrame = requestAnimationFrame(frame);
      }
    }
    animFrame = requestAnimationFrame(frame);

    wipeTimeout = setTimeout(() => {
      document.getElementById("outputMsg").value = "";
      container.style.display = "none";
      showStatus("Purettu teksti pyyhittiin turvallisuussyistä.", "#64748b");
    }, totalMs);
  }

  function clearTimers() {
    if (wipeTimeout) clearTimeout(wipeTimeout);
    if (animFrame) cancelAnimationFrame(animFrame);
    document.getElementById("timerContainer").style.display = "none";
  }

  function wipeAll() {
    clearTimers();
    document.getElementById("pwd").value = "";
    document.getElementById("inputMsg").value = "";
    document.getElementById("outputMsg").value = "";
    showStatus("Ruutu tyhjennetty.", "#64748b");
  }

  function copyOutput() {
    const out = document.getElementById("outputMsg");
    if (!out.value) return;
    navigator.clipboard.writeText(out.value).then(() => {
      showStatus("Kopioitu leikepöydälle!", "#2563eb");
    }).catch(() => {
      out.select();
      document.execCommand("copy");
      showStatus("Kopioitu leikepöydälle!", "#2563eb");
    });
  }

  // Tapahtumakuuntelijat suoraan napeille
  document.getElementById("btnEncrypt").addEventListener("click", handleEncrypt);
  document.getElementById("btnDecrypt").addEventListener("click", handleDecrypt);
  document.getElementById("wipeBtn").addEventListener("click", wipeAll);
  document.getElementById("btnCopy").addEventListener("click", copyOutput);

  // Pyyhitään näyttö, jos sivu siirtyy taustalle
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      wipeAll();
    }
  });
</script>

</body>
</html>
